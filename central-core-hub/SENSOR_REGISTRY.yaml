# Central sensor registry for Central Core Hub
# Purpose:
# - Single source-of-truth listing sensors and binary_sensors the add-on publishes or handles
# - Helps decide which entities to include in telemetry and Vault payloads
# - Consumers: documentation, release notes, and (optionally) runtime code that publishes sensors

# Format:
# - entries: list of sensor records
# - fields
#   - entity_id: Home Assistant entity_id or a pattern (e.g. sensor.*)
#   - type: 'sensor' or 'binary_sensor'
#   - provide: boolean (whether the add-on should include/publish this)
#   - rationale: short reason for inclusion or exclusion
#   - friendly_name: human-friendly name as provided by Home Assistant

apply_registry: true
registry_mode: deny

# Optional top-level `registry_mode`: "deny" | "allow". When absent and
# `apply_registry` is false, the registry is ignored and all sensors are
# included. Set `apply_registry: true` or `registry_mode` to enable registry
# enforcement.
# registry_mode: deny
# Examples of wildcard patterns you can use in `entity_id`:
# - `binary_sensor.*`         -> matches all binary sensors
# - `sensor.temperature_*`    -> matches any sensor starting with temperature_
# - `sensor.*_battery`        -> matches sensors ending with _battery

entries: []
# Device class-based filtering is now implemented in the fetch_sensors function.
# Safe device classes: temperature, motion, door, battery, occupancy, presence, opening, aqi, energy
# Sensors with unsafe device classes (e.g., password, payment, etc.) are automatically filtered out.
# Sensors without a device_class attribute are excluded from telemetry.

