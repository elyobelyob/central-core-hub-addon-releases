# Device class based filtering examples
# Note: device_class filtering is implemented in fetch_sensors code.
# The following entries document the expected behavior:
# - entity_id: sensor.*
#   type: sensor
#   provide: true
#   attributes:
#     device_class: motion
#   rationale: "Include motion sensors based on device_class attribute"

# - entity_id: binary_sensor.*
#   type: binary_sensor
#   provide: true
#   attributes:
#     device_class: door
#   rationale: "Include door sensors based on device_class attribute"

# - entity_id: binary_sensor.*
#   type: binary_sensor
#   provide: true
#   attributes:
#     device_class: presence
#   rationale: "Include presence sensors based on device_class attribute"

# How to use
# - Update entries to reflect real entity_ids your Home Assistant exposes.
# - Set `provide: true` for sensors the add-on should include in published telemetry and Vault payloads.
# - The runtime code (e.g. `fetch_sensors`, `publish_sensors`) can be adapted to consult this file
#   if you want a centralized allowlist/denylist for sensors.

# Suggested next steps
