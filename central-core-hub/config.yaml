name: "Central Core Hub"
description: "Central Core Hub Add-on"
version: "2.1.0"
slug: "central-core-hub"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto
stage: stable
timeout: 30
network:
  host: true
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  mqtt_cert_bundle: ""
  client_id: ""
  ha_api_url: ""
  ha_api_token: ""
  telemetry_interval: 30
  safe_device_classes:
    - motion
    - door
    - presence
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool
  mqtt_cert_bundle: password
  client_id: str?
  ha_api_url: str?
  ha_api_token: password?
  telemetry_interval: int
  safe_device_classes:
    - str
  debug_logging: bool?
