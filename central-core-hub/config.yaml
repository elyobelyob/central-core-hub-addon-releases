name: "Central Core Hub"
description: "Central Core Hub Add-on"
version: "1.1.61"
slug: "central-core-hub"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto
stage: stable
timeout: 30
network:
  host: true
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  mqtt_cert_bundle: ""
  client_id: "home-assistant"
  ha_api_url: ""
  ha_api_token: ""
  telemetry_interval: 30
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: str?
  mqtt_tls: bool
  mqtt_cert_bundle: password
  client_id: str?
  ha_api_url: str?
  ha_api_token: str?
  telemetry_interval: int
