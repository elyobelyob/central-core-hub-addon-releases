name: Build and publish Docker image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v7
          - linux/arm64
          - linux/386
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (PAT or GITHUB_TOKEN)
        run: |
          echo "Logging in to GHCR..."
          if [ -n "${{ secrets.GHCR_PAT }}" ]; then
            echo "Using GHCR_PAT"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          else
            echo "Using GITHUB_TOKEN"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

      - name: Set BUILD_FROM
        run: |
          if [ "${{ matrix.platform }}" = "linux/amd64" ]; then
            echo "BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest" >> $GITHUB_ENV
          elif [ "${{ matrix.platform }}" = "linux/arm/v7" ]; then
            echo "BUILD_FROM=ghcr.io/home-assistant/armv7-base:latest" >> $GITHUB_ENV
          elif [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            echo "BUILD_FROM=ghcr.io/home-assistant/aarch64-base:latest" >> $GITHUB_ENV
          elif [ "${{ matrix.platform }}" = "linux/386" ]; then
            echo "BUILD_FROM=ghcr.io/home-assistant/i386-base:latest" >> $GITHUB_ENV
          fi

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/elyobelyob/central-core-hub:${{ github.ref_name }}
            ghcr.io/elyobelyob/central-core-hub:latest
          file: central-core-hub/Dockerfile
          context: central-core-hub
          build-args: BUILD_FROM=${{ env.BUILD_FROM }}
