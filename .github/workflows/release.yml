name: Build and publish Docker image

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set BUILD_FROM
        id: set-build-from
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux/amd64" ]; then
            echo "build_from=ghcr.io/home-assistant/amd64-base:latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            echo "build_from=ghcr.io/home-assistant/aarch64-base:latest" >> "$GITHUB_OUTPUT"
          else
            echo "build_from=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/elyobelyob/central-core-hub:${{ github.ref_name }}
            ghcr.io/elyobelyob/central-core-hub:latest
          context: central-core-hub
          build-args: BUILD_FROM=${{ steps.set-build-from.outputs.build_from }}
