name: CI

# The whole suite is quick, so every pull request runs all of it, once per change
# (not again on the merge to main), skipping doc-only changes. "Run workflow" runs
# it on demand. Keeps within the free GitHub Actions minutes.
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# A newer push to the same PR cancels the run for the older one.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r central-core-hub/requirements.txt || true
          pip install -r requirements-dev.txt
          # Ensure PyYAML is available for tests that import `yaml`
          pip install pyyaml

      - name: Run linters
        run: |
          pip install ruff
          ruff check .

      - name: Run type checks (pyright)
        run: |
          npm install -g pyright
          pyright

      - name: Run tests with coverage
        working-directory: central-core-hub
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest-cov
          # Ensure YAML is available in the test environment
          pip install pyyaml
          pytest -q --cov=central-core-hub --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage to Codecov (optional)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: central-core-hub/coverage.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true
