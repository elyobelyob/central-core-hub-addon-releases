name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r central-core-hub/requirements.txt || true
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: |
          ruff check . || ruff check . --select F

      - name: Run type checks (pyright)
        run: |
          npx pyright --version || true
          npx pyright || true

      - name: Run tests
        run: |
          pytest -q
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          # Use built-in pip caching to speed up installs (caches wheels)
          cache: 'pip'
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies (prefer PyPI, fall back to GitHub)
        run: |
          python -m pip install --upgrade pip
          # Try installing the released package first from PyPI; if not
          # available, fall back to installing the package directly from
          # the GitHub repository. Finally install the repo's requirements
          # and ensure PyYAML is available for tests that parse YAML.
          pip install central-core-mqtt-shared || pip install git+https://github.com/elyobelyob/central-core-mqtt-shared.git@main
          pip install -r requirements.txt
          pip install pyyaml
      - name: Run linters and type checks
        run: |
          pip install pyright ruff
          pyright
          # Ruff will read configuration from pyproject.toml
          ruff check .
      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest -q --cov=central-core-hub --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
