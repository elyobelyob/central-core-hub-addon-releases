line-length = 120
exclude = [".venv", "build", "dist", "venv", ".git", "__pycache__"]

# Black compatibility: Black's formatting can trigger some pycodestyle
# warnings (notably E203). Ignore that so Ruff+Black behave consistently
# and don't fight each other.
[lint]
extend-ignore = ["E203"]

# Common per-file ignores (e.g. allow unused imports in package __init__ files)
per-file-ignores = {"__init__.py" = ["F401"]}

# The rule set this code was written against: Ruff's long-standing defaults.
# A later Ruff release broadened the defaults (blind-except, security,
# import sorting…), and CI installs the latest Ruff, so relying on the
# defaults turned CI red overnight with 705 findings no one had chosen.
# Widen this deliberately, not by upgrading Ruff.
select = ["E4", "E7", "E9", "F"]
